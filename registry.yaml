skills:
  - id: catalog-config
    category: data
    description: >-
      Kedro catalog configuration guidance for conf/**/*.yml files. Use when adding
      datasets, editing catalog entries, setting up factories, or working with
      credentials and parameter interpolation.
    paths:
      - "conf/**/*.yml"
      - "conf/**/*.yaml"
    ide_support:
      - cursor
      - copilot
      - claude
      - codex

  - id: parameters-and-config
    category: data
    description: >-
      Kedro parameters and credentials guidance for conf/**/parameters*.yml and
      conf/**/credentials*.yml files. Use when editing parameters, credentials,
      or working with configuration interpolation and runtime overrides.
    paths:
      - "conf/**/parameters*.yml"
      - "conf/**/parameters*.yaml"
      - "conf/**/credentials*.yml"
      - "conf/**/credentials*.yaml"
    ide_support:
      - cursor
      - copilot
      - claude
      - codex

  - id: llm-context-nodes
    category: genai
    description: >-
      Guidance for Kedro's llm_context_node, LLMContextNode, LLMContext and
      tool() API in src/**/pipelines/**/*.py. Use when composing an LLM dataset,
      prompt datasets and tool builders into an LLMContext, or writing the node
      that consumes one, in GenAI or agent pipelines. Adds nothing for ordinary
      pipeline code.
    paths:
      - "src/**/pipelines/**/*.py"
    ide_support:
      - cursor
      - copilot
      - claude
      - codex

  # testing-pipelines ships in two variants written two different ways (by hand
  # and with the skill-creator skill) so they can be compared side by side. See
  # docs/skill-creation-comparison/.
  - id: testing-pipelines-raw
    category: testing
    description: >-
      Kedro testing guidance for tests/**/*.py in a Kedro project. Use when writing
      unit tests for node functions, pipeline tests with DataCatalog, MemoryDataset
      and SequentialRunner, or KedroSession smoke tests. Adds nothing for tests
      that do not touch Kedro.
    paths:
      - "tests/**/*.py"
    ide_support:
      - cursor
      - copilot
      - claude
      - codex

  - id: testing-pipelines-skill-creator
    category: testing
    description: >-
      How to write tests for a Kedro 1.x project in tests/**/*.py, covering unit tests for
      node functions, in-memory pipeline tests with DataCatalog, MemoryDataset and
      SequentialRunner, and KedroSession smoke tests. Use this whenever you write,
      fix or review a test that imports kedro or a Kedro project's nodes and
      pipelines, even when the request is just "add tests for this pipeline" or
      "why does my pipeline test fail". Kedro 1.x changed what runners return and
      how sessions start, and older examples get both wrong. Not needed for tests
      that never touch Kedro.
    paths:
      - "tests/**/*.py"
    ide_support:
      - cursor
      - copilot
      - claude
      - codex

  - id: explain-project
    category: onboarding
    description: >-
      Guidance for explaining an existing Kedro project, covering its structure,
      registered pipelines, data flow, Data Catalog, parameters, configuration,
      credentials, hooks and Kedro-Viz. Use when asked to explain, summarise or
      review how a project is built, to onboard onto it, or to answer a question
      about it, such as where a dataset, parameter or piece of logic lives, whether
      an output is saved, which Kedro version it uses, which credentials it needs,
      or how to view it or its experiment tracking in Kedro-Viz. Adds nothing when
      writing or changing code, or for a full best-practice audit.
    paths:
      - "src/**/pipeline_registry.py"
      - "src/**/settings.py"
    ide_support:
      - cursor
      - copilot
      - claude
      - codex
