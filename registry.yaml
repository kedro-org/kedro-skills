skills:
  - id: catalog-config
    category: data
    description: >-
      Kedro catalog configuration guidance for conf/**/*.yml files. Use when adding
      datasets, editing catalog entries, setting up factories, or working with
      credentials and parameter interpolation.
    paths:
      - "conf/**/*.yml"
      - "conf/**/*.yaml"
    ide_support:
      - cursor
      - copilot
      - claude
      - codex

  - id: parameters-and-config
    category: data
    description: >-
      Kedro parameters and credentials guidance for conf/**/parameters*.yml and
      conf/**/credentials*.yml files. Use when editing parameters, credentials,
      or working with configuration interpolation and runtime overrides.
    paths:
      - "conf/**/parameters*.yml"
      - "conf/**/parameters*.yaml"
      - "conf/**/credentials*.yml"
      - "conf/**/credentials*.yaml"
    ide_support:
      - cursor
      - copilot
      - claude
      - codex

  - id: llm-context-nodes
    category: genai
    description: >-
      Guidance for Kedro's llm_context_node, LLMContextNode, LLMContext and
      tool() API in src/**/pipelines/**/*.py. Use when composing an LLM dataset,
      prompt datasets and tool builders into an LLMContext, or writing the node
      that consumes one, in GenAI or agent pipelines. Adds nothing for ordinary
      pipeline code.
    paths:
      - "src/**/pipelines/**/*.py"
    ide_support:
      - cursor
      - copilot
      - claude
      - codex

  - id: kedro-deploy-databricks
    category: deployment
    description: >-
      Kedro deployment guidance for Databricks. Use when choosing between Git
      folders, Databricks Connect and Declarative Automation Bundles (DABs, formerly
      Databricks Asset Bundles), packaging a Kedro project as a wheel, generating or
      editing a bundle with kedro-databricks, getting conf and environments onto
      Databricks, using Unity Catalog volumes, reading secrets from secret scopes,
      mapping nodes to job tasks, or validating a bundle before deploying. Defers
      cluster configuration, permissions and Terraform or deploy-engine errors to
      Databricks documentation.
    paths:
      - "databricks.yml"
      - "databricks.yaml"
      - "resources/*.yml"
      - "resources/*.yaml"
      - "resources/**/*.yml"
      - "resources/**/*.yaml"
      - "conf/**/databricks*.yml"
      - "conf/**/databricks*.yaml"
      - "conf/**/databricks/**/*.yml"
      - "conf/**/databricks/**/*.yaml"
      - ".github/workflows/*databricks*.yml"
    ide_support:
      - cursor
      - copilot
      - claude
      - codex
