skills:
  - id: kedro-catalog-config
    category: data
    description: >-
      Kedro catalog configuration guidance for conf/**/*.yml files. Use when adding
      datasets, editing catalog entries, setting up factories, or working with
      credentials and parameter interpolation.
    paths:
      - "conf/**/*.yml"
      - "conf/**/*.yaml"
    ide_support:
      - cursor
      - copilot
      - claude
      - codex

  - id: kedro-parameters-and-config
    category: data
    description: >-
      Kedro parameters and credentials guidance for conf/**/parameters*.yml and
      conf/**/credentials*.yml files. Use when editing parameters, credentials,
      or working with configuration interpolation and runtime overrides.
    paths:
      - "conf/**/parameters*.yml"
      - "conf/**/parameters*.yaml"
      - "conf/**/credentials*.yml"
      - "conf/**/credentials*.yaml"
    ide_support:
      - cursor
      - copilot
      - claude
      - codex

  - id: kedro-llm-context-nodes
    category: genai
    description: >-
      Guidance for Kedro's llm_context_node, LLMContextNode, LLMContext and
      tool() API in src/**/pipelines/**/*.py. Use when composing an LLM dataset,
      prompt datasets and tool builders into an LLMContext, or writing the node
      that consumes one, in GenAI or agent pipelines. Adds nothing for ordinary
      pipeline code.
    paths:
      - "src/**/pipelines/**/*.py"
    ide_support:
      - cursor
      - copilot
      - claude
      - codex

  - id: kedro-testing-pipelines
    category: testing
    description: >-
      Kedro testing guidance for tests/**/*.py in a Kedro project. Use when writing
      unit tests for node functions, pipeline tests with DataCatalog, MemoryDataset
      and SequentialRunner, or KedroSession smoke tests. Adds nothing for tests
      that do not touch Kedro.
    paths:
      - "tests/**/*.py"
    ide_support:
      - cursor
      - copilot
      - claude
      - codex
  
  - id: kedro-build-demo
    category: onboarding
    description: >-
      Builds a new, small, end-to-end Kedro demo for someone's use case, with a
      working project, a self-contained HTML walkthrough and Kedro-Viz guidance.
      Use when someone asks for a Kedro demo or proof of concept, or
      wants to see whether and how Kedro would work for their problem. Not for
      changing or explaining an existing project.
    paths: []
    ide_support:
      - cursor
      - copilot
      - claude
      - codex

  - id: kedro-explain-project
    category: onboarding
    description: >-
      Guidance for explaining an existing Kedro project, covering its structure,
      registered pipelines, data flow, Data Catalog, parameters, configuration,
      credentials, hooks and Kedro-Viz. Use when asked to explain, summarise or
      review how a project is built, to onboard onto it, or to answer a question
      about it, such as where a dataset, parameter or piece of logic lives, whether
      an output is saved, which Kedro version it uses, which credentials it needs,
      or how to view it or its experiment tracking in Kedro-Viz. Adds nothing when
      writing or changing code, or for a full best-practice audit.
    paths:
      - "src/**/pipeline_registry.py"
      - "src/**/settings.py"
    ide_support:
      - cursor
      - copilot
      - claude
      - codex

  - id: kedro-deploy-databricks
    category: deployment
    description: >-
      Kedro deployment guidance for Databricks. Use when choosing between Git
      folders, Databricks Connect and Declarative Automation Bundles (DABs, formerly
      Databricks Asset Bundles), packaging a Kedro project as a wheel, generating or
      editing a bundle with kedro-databricks, getting conf and environments onto
      Databricks, using Unity Catalog volumes, reading secrets from secret scopes,
      mapping nodes to job tasks, or validating a bundle before deploying. Defers
      cluster configuration, permissions and Terraform or deploy-engine errors to
      Databricks documentation.
    paths:
      - "databricks.yml"
      - "databricks.yaml"
      - "resources/*.yml"
      - "resources/*.yaml"
      - "conf/**/databricks*.yml"
      - "conf/**/databricks*.yaml"
      - "conf/**/databricks/**/*.yml"
      - "conf/**/databricks/**/*.yaml"
      - ".github/workflows/*databricks*.yml"
      - ".github/workflows/*databricks*.yaml"
    ide_support:
      - cursor
      - copilot
      - claude
      - codex

  - id: kedro-quality-check
    category: quality
    description: >-
      Evaluate a Kedro project against the rules in this skill's kedro-rules.md,
      grouped into functional appropriateness, performance efficiency and
      maintainability. Writes the verdicts to kedro-quality-check/results.json and
      builds kedro-quality-check/dashboard.html. Use when asked to review, check, score
      or audit a Kedro pipeline, evaluate it against kedro-rules.md, or build the
      quality dashboard.
    paths: []
    ide_support:
      - cursor
      - copilot
      - claude
      - codex
